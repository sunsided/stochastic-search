# Publishes stochastic-search when release-plz pushes its vX.Y.Z tag.
# Runs in the `crates-io` environment, which only allows v*.*.* tags.
# crates.io trusted publishing is bound to this file name and environment: do not rename either.
# Actions are pinned to commit SHAs (tag in the comment); Dependabot updates them.
# search-core is a sibling path dependency: the jobs check it out next to this crate
# (.github/actions/checkout-siblings) and run from stochastic-search/. cargo publish swaps the
# path for the `version` requirement, so the published crate uses search-core from crates.io.
name: Publish

on:
  push:
    tags:
      # SemVer 2.0 releases and pre-releases (v1.2.0, v1.2.0-rc.1).
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions: {}

jobs:
  verify:
    name: verify tagged commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: stochastic-search
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: stochastic-search
          persist-credentials: false
      - uses: ./stochastic-search/.github/actions/checkout-siblings # zizmor: ignore[self-repository] actionlint 1.7.12 rejects `$/`
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-nextest
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --workspace --all-features --doc

  crates-io:
    name: publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/${{ steps.crate.outputs.name }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: stochastic-search
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: stochastic-search
          persist-credentials: false
      - uses: ./stochastic-search/.github/actions/checkout-siblings # zizmor: ignore[self-repository] actionlint 1.7.12 rejects `$/`
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Resolve crate and version from the tag
        id: crate
        run: |
          name=stochastic-search
          version="${GITHUB_REF_NAME#v}"
          actual="$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg n "$name" '.packages[] | select(.name == $n) | .version')"
          if [ "$actual" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match $name $actual"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Skip versions that are already on crates.io
        id: check
        # The first release of a crate is published by hand, and re-runs must be harmless.
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' -A "$GITHUB_REPOSITORY publish workflow" \
            "https://crates.io/api/v1/crates/$CRATE/$VERSION")"
          if [ "$status" = 200 ]; then
            echo "::notice::$CRATE $VERSION is already on crates.io; nothing to publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          CRATE: ${{ steps.crate.outputs.name }}
          VERSION: ${{ steps.crate.outputs.version }}
      - if: steps.check.outputs.published != 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish
        if: steps.check.outputs.published != 'true'
        run: cargo publish -p stochastic-search
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
