# release-plz (git-only mode): keeps a release PR up to date on every push to main and, once it
# is merged, creates the vX.Y.Z tag and GitHub Releases. It never publishes: the
# tag push starts publish-crates-io.yml, which publishes from the tag-restricted `crates-io` environment.
# The App token matters: tags and PRs created with GITHUB_TOKEN would not trigger other workflows.
# Dormant until the repository variable RELEASE_APP_CLIENT_ID is set (CONTRIBUTING.md, Releases).
# search-core is a sibling path dependency: the jobs check it out next to this crate
# (.github/actions/checkout-siblings) and point release-plz at stochastic-search/.
name: Release-plz

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-plz-release:
    name: Release-plz release
    if: github.repository_owner == 'sunsided' && vars.RELEASE_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    # No concurrency group here: cancelling a pending run could skip a release.
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: stochastic-search
          fetch-depth: 0
          persist-credentials: false
      - uses: ./stochastic-search/.github/actions/checkout-siblings # zizmor: ignore[self-repository] actionlint 1.7.12 rejects `$/`
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
          manifest_path: stochastic-search/Cargo.toml
          config: stochastic-search/release-plz.toml
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  release-plz-pr:
    name: Release-plz PR
    if: github.repository_owner == 'sunsided' && vars.RELEASE_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: stochastic-search
          fetch-depth: 0
          persist-credentials: false
      - uses: ./stochastic-search/.github/actions/checkout-siblings # zizmor: ignore[self-repository] actionlint 1.7.12 rejects `$/`
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
          manifest_path: stochastic-search/Cargo.toml
          config: stochastic-search/release-plz.toml
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
