[package]
name = "stochastic-search"
description = "Planning under probabilistic outcomes: LAO*, iLAO*, CG-iLAO*, RTDP, LRTDP, BRTDP, FRTDP, VPI-RTDP, POMCP, DESPOT and multi-objective MOLAO*/MOLRTDP"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunsided/stochastic-search"
readme = "README.md"
keywords = ["mdp", "planning", "pomdp", "rtdp", "search"]
categories = ["algorithms", "science", "no-std"]

[dependencies]
# The shared Goal, Heuristic and Budget traits of the planning crates.
search-core = { path = "../search-core", version = "0.3" }
# Hash table for state interning under no_std; see docs/design.md.
hashbrown = { version = "0.16", default-features = false, features = ["default-hasher"] }
# Square roots, logarithms and powers for UCB and discounting under no_std.
libm = "0.2.16"
# The generator trait of the POMDP generative model.
rand_core = { version = "0.10.1", default-features = false }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.12"

[[bench]]
name = "planners"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid.html"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"
